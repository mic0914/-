name: Apply Ver.3.23 choice consistency patch
on:
  push:
    paths:
      - '.github/workflows/patch-v323.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/patch_v323.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          assert 'Ver.3.23' in s
          assert 'CARGO_FUNCTION_PRIORITY' in s
          assert 'function resolveCargoPriority()' in s
          assert 'REC-PRIORITY' in s
          assert 'if(x?.type==="REQUIRED_BATCH")for(const item of x.batchItems||[])' in s
          PY
          node --check /tmp/app.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update to Ver.3.23 fixing required priority-action generation'
          git push origin main
