name: Apply Ver.3.24 phase-label patch
on:
  push:
    paths:
      - '.github/workflows/patch-v324.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/patch_v324.py
      - name: Validate JavaScript and phase changes
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          assert 'Ver.3.24' in s
          assert 'function phaseLabel(turn=sim.currentTurn)' in s
          assert 'function phaseGapText(key,text)' in s
          assert 'sim.opportunityPhases=new Map()' in s
          assert 'text:phaseGapText(key,text)' in s
          assert 'Phase番号は、その対応候補が実際に提示された選択段階' in s
          assert '"調査結果",r.text' not in s
          PY
          node --check /tmp/app.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update to Ver.3.24 with numbered Phase result labels and gap references'
          git push origin main
