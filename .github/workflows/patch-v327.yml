name: Apply Ver.3.27 result note removal
on:
  push:
    paths: ['patch_v327.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_v327.py
      - name: Validate
        run: |
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          assert 'Ver.3.27' in s
          assert 'Phase番号は、その対応候補が実際に提示された選択段階を示します。' not in s
          assert 'その時点で必要な重要対応は、通常4択＋再検討3回の最大16候補内' not in s
          m=re.search(r'<script>([\s\S]*?)</script>',s);pathlib.Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update to Ver.3.27 removing result explanatory notes'
          git push
