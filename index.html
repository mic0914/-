<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>港湾BCP 5分シミュレーション（案）</title>
<style>
  :root {
    --bg: #eef2f5;
    --panel: #ffffff;
    --line-left: #ffffff;
    --line-player: #d8f7c6;
    --event-bg: #fff3cd;
    --danger-bg: #fde2e2;
    --system-bg: #e9eef6;
    --result-bg: #f7f9fb;
    --border: #d7dde5;
    --text: #1d2733;
    --sub: #5a6775;
    --header: #16324a;
    --accent: #245b7a;
    --button: #245b7a;
    --button-disabled: #9aa8b5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    height: 100%;
  }

  body {
    display: flex;
    justify-content: center;
  }

  .app {
    width: min(100%, 820px);
    min-height: 100vh;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 24px rgba(0,0,0,.08);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--header);
    color: white;
    padding: 12px 14px 10px;
    border-bottom: 1px solid rgba(255,255,255,.15);
  }

  .title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 8px;
  }

  .meta {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px 12px;
    align-items: center;
    font-size: 13px;
  }

  .meta .scenario { opacity: .92; }
  .turn { font-weight: 700; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .5px;
  }

  .timer.overtime {
    color: #ffb3b3;
  }

  .progress {
    height: 4px;
    margin-top: 9px;
    background: rgba(255,255,255,.18);
    overflow: hidden;
    border-radius: 999px;
  }
  .progress > div {
    height: 100%;
    width: 0%;
    background: #d8eef9;
    transition: width .25s ease;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px calc(var(--control-height, 260px) + 24px);
    scroll-padding-bottom: calc(var(--control-height, 260px) + 24px);
    background:
      linear-gradient(rgba(255,255,255,.87), rgba(255,255,255,.87)),
      repeating-linear-gradient(
        0deg,
        #f8fafc 0,
        #f8fafc 24px,
        #f4f7f9 25px
      );
  }

  .msg-row {
    display: flex;
    margin: 10px 0;
    scroll-margin-bottom: calc(var(--control-height, 260px) + 24px);
  }
  .msg-row.left { justify-content: flex-start; }
  .msg-row.right { justify-content: flex-end; }
  .msg {
    max-width: 78%;
    border-radius: 16px;
    padding: 10px 12px;
    line-height: 1.55;
    font-size: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg .name {
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    margin-bottom: 4px;
  }
  .msg.player { background: var(--line-player); }
  .msg.info { background: var(--line-left); }
  .msg.system { background: var(--system-bg); }
  .msg.result { background: var(--result-bg); border-left: 4px solid var(--accent); }
  .msg.event { background: var(--event-bg); border-left: 4px solid #c99700; }
  .msg.event.danger { background: var(--danger-bg); border-left-color: #c93b3b; }
  .msg.score { background: #eef7ff; border-left: 4px solid #2f6d9b; }

  .chip {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid #ccd6df;
    color: #435160;
    font-size: 11px;
    background: #fff;
  }

  .control-wrap {
    position: fixed;
    bottom: 0;
    width: min(100%, 820px);
    z-index: 30;
    background: rgba(255,255,255,.98);
    border-top: 1px solid var(--border);
    padding: 10px 12px 12px;
    box-shadow: 0 -6px 18px rgba(0,0,0,.06);
  }

  .prompt {
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 7px;
  }

  .controls {
    display: block;
  }

  button {
    border: 0;
    background: var(--button);
    color: white;
    font-weight: 700;
    cursor: pointer;
    padding: 0 12px;
    font: inherit;
  }
  button:disabled {
    background: var(--button-disabled);
    cursor: default;
  }

  .choice-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .choice-button {
    width: 100%;
    min-height: 48px;
    border-radius: 12px;
    padding: 10px 14px;
    text-align: left;
    line-height: 1.4;
    background: #ffffff;
    color: var(--text);
    border: 1px solid #aebbc7;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    font-weight: 700;
  }

  .choice-button:hover:not(:disabled) {
    background: #f3f7fa;
    border-color: #7f93a5;
  }

  .choice-button:active:not(:disabled) {
    transform: translateY(1px);
  }

  .choice-button:disabled {
    color: #6e7a86;
    background: #eef2f5;
    border-color: #cfd7df;
  }

  .secondary {
    background: #5f6f7e;
  }

  .restart {
    width: 100%;
    margin-top: 8px;
    display: none;
  }

  #chat::after {
    content: "";
    display: block;
    height: 1px;
  }

  .small-note {
    font-size: 11px;
    color: var(--sub);
    margin-top: 6px;
  }

  .score-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 3px 12px;
    margin-top: 6px;
  }
  .score-grid div:nth-child(even) {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }


  .level-help-row {
    margin-top: 8px;
    display: flex;
    justify-content: flex-end;
  }

  .level-help-btn {
    min-height: 30px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12);
    color: white;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .level-guide {
    display: none;
    margin-top: 8px;
    background: rgba(255,255,255,.98);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.16);
    font-size: 12px;
    line-height: 1.5;
  }

  .level-guide.open {
    display: block;
  }

  .level-guide-grid {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 4px 8px;
    align-items: start;
  }

  .level-guide .lv {
    font-weight: 800;
    min-width: 26px;
  }

  .level-guide .name {
    font-weight: 800;
    min-width: 46px;
  }

  .level-pill {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid #c8d2dc;
    background: #fff;
    font-weight: 800;
    font-size: 11px;
  }

  @media (max-width: 560px) {
    .title { font-size: 16px; }
    .meta {
      grid-template-columns: 1fr auto;
    }
    .meta .scenario {
      grid-column: 1 / -1;
    }
    .msg { max-width: 86%; }
    #chat { padding-left: 10px; padding-right: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">港湾BCP 5分シミュレーション（案）</div>
    <div class="meta">
      <div class="scenario">Scenario: <span id="scenarioLabel">EQTS-PROTOTYPE-001</span> ／ モデル港</div>
      <div class="turn" id="turnLabel">TURN 01 / 15</div>
      <div class="timer" id="timerLabel">05:00</div>
    </div>
    <div class="progress"><div id="progressBar"></div></div>

    <div class="level-help-row">
      <button type="button" id="levelHelpButton" class="level-help-btn" aria-expanded="false">L0～L4とは？</button>
    </div>
    <div id="levelGuide" class="level-guide" aria-hidden="true">
      <div class="level-guide-grid">
        <div class="lv">L0</div><div class="name">正常</div><div>被害なし・通常利用可能</div>
        <div class="lv">L1</div><div class="name">軽微</div><div>軽微な被害・概ね利用可能</div>
        <div class="lv">L2</div><div class="name">中程度</div><div>部分的な利用制限が必要</div>
        <div class="lv">L3</div><div class="name">重大</div><div>大幅な利用制限・応急対応が必要</div>
        <div class="lv">L4</div><div class="name">甚大</div><div>原則として当該機能を利用できない</div>
      </div>
      <div style="margin-top:6px;color:#5a6775;">※ 本シミュレーション内部の評価区分であり、国土交通省の公式被災判定区分ではありません。</div>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div class="control-wrap">
    <div class="prompt" id="promptText">次の対応を選択してください</div>
    <div class="controls">
      <div id="choiceList" class="choice-list" aria-label="次の対応"></div>
    </div>
    <button id="restartButton" class="restart secondary">もう一度実施する</button>
    <div class="small-note">選択肢を1回タップすると確定します。目標時間は5分です。00:00を超えてもTURN15まで継続します。</div>
  </div>
</div>

/* =========================
   Utility
========================= */
function levelAtLeast(level, minLevel) {
  return LEVEL_VALUE[level] >= LEVEL_VALUE[minLevel];
}
function clampLevel(n) {
  return "L" + Math.max(0, Math.min(4, n));
}
function weightedLevel(weightMap) {
  const entries = Object.entries(weightMap);
  const total = entries.reduce((s,[,w]) => s+w, 0);
  let r = Math.random() * total;
  for (const [level, weight] of entries) {
    r -= weight;
    if (r <= 0) return level;
  }
  return entries[entries.length - 1][0];
}
function randomChoice(arr) {
  return arr[Math.floor(Math.random()*arr.length)];
}
function formatClock(seconds) {
  const overtime = seconds < 0;
  const s = Math.abs(seconds);
  const mm = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  return (overtime ? "－" : "") + mm + ":" + ss;
}
function nowTurnEntry(dec) {
  return [...simState.decisionHistory].reverse().find(x => x.dec === dec);
}
function hasChecked(dec) {
  return simState.knownState[dec] && simState.knownState[dec].level !== "UNKNOWN";
}
function logDebug(...args) {
  if (DEBUG_MODE) console.log(...args);
}

/* =========================
   State Initialization
========================= */
function createInitialState() {
  if (DEBUG_MODE) return {...DEBUG_FIXED_STATE};

  const state = {};
  for (const [dec, weights] of Object.entries(WEIGHTS)) {
    state[dec] = weightedLevel(weights);
  }
  const d04 = Math.max(0, LEVEL_VALUE[state.DEC04] - 1);
  const d05 = LEVEL_VALUE[state.DEC05];
  state.DEC13 = clampLevel(Math.max(d04, d05));
  return state;
}

function initKnownState() {
  const out = {};
  for (const dec of Object.keys(DEC_META)) {
    out[dec] = {
      level:"UNKNOWN",
      confidence:null,
      confirmed:false,
      lastCheckedTurn:null,
      stale:false
    };
  }
  return out;
}

function resetSimulation() {

  simState.currentTurn = 1;
  simState.elapsedSeconds = 0;
  simState.remainingSeconds = TARGET_SECONDS;

  simState.knownState = initKnownState();
  simState.decisionHistory = [];
  simState.eventHistory = [];
  simState.lastResult = null;
  simState.lastEventAt = -999;
  simState.activeEventBoosts = {};
  simState.recoveryResult = null;

    "情報確度 C"

/* =========================
   Timer / Events
========================= */
function startTimer() {
  timerHandle = setInterval(() => {
    if (simState.finished) return;
    simState.elapsedSeconds += 1;
    simState.remainingSeconds = TARGET_SECONDS - simState.elapsedSeconds;

    if (simState.remainingSeconds === 60 && !simState.warning60Shown) {
      simState.warning60Shown = true;
      addMessage("left","system","システム","残り1分です。");
    }

    if (simState.remainingSeconds === 0 && !simState.overtimeShown) {
      simState.overtimeShown = true;
      addMessage("left","event danger","システム",
        "TARGET TIME OVER\n目標時間5分を超過しました。シミュレーションはTURN15まで継続します。"
      );
    }

    maybeTriggerTimedEvent();
    updateHeader();
  }, 1000);
}

function maybeTriggerTimedEvent() {
  if (simState.finished || simState.currentTurn >= 15) return;
  if (simState.elapsedSeconds - simState.lastEventAt < 15) return;

  for (const evt of EVENT_MASTER) {
    const already = simState.eventHistory.some(x => x.id === evt.id);
    if (evt.once && already) continue;
    if (simState.elapsedSeconds < evt.minTime || simState.elapsedSeconds > evt.maxTime) continue;

    if (evt.id === "EVT03" && !levelAtLeast(simState.actualState.DEC05, "L2")) continue;

    // Small per-second hazard scaled from overall intended probability.
    const window = Math.max(1, evt.maxTime - evt.minTime + 1);
    const perSecond = evt.probability / window;
    if (Math.random() < perSecond) {
      triggerEvent(evt);
      break;
    }
  }
}

function triggerEvent(evt) {
  simState.lastEventAt = simState.elapsedSeconds;
  simState.eventHistory.push({id:evt.id, name:evt.name, at:simState.elapsedSeconds});
  let message = "";

  if (evt.id === "EVT01") {
    message = "余震が発生しました。既に被災している施設で被害が拡大した可能性があります。";
    for (const dec of ["DEC03","DEC06","DEC11"]) {
      if (levelAtLeast(simState.actualState[dec], "L2")) {
        const r = Math.random();
        if (r < 0.25) {
          simState.actualState[dec] = clampLevel(LEVEL_VALUE[simState.actualState[dec]] + 1);
          if (hasChecked(dec)) simState.knownState[dec].stale = true;
        }
      }
    }
    simState.activeEventBoosts.DEC03 = 20;
    simState.activeEventBoosts.DEC06 = 20;
    simState.activeEventBoosts.DEC11 = 20;
  }

  if (evt.id === "EVT02") {
    message = "津波警報が継続しています。港内の水位変動が続いています。航路・岸壁背後の状況が変化する可能性があります。";
    simState.activeEventBoosts.DEC05 = 20;
    simState.activeEventBoosts.DEC06 = 10;
    if (hasChecked("DEC05")) simState.knownState.DEC05.stale = true;
  }

  if (evt.id === "EVT03") {
    message = "水位・流れの変化により、港内の漂流物位置が変化した可能性があります。";
    if (Math.random() < 0.30) {
      simState.actualState.DEC05 = clampLevel(LEVEL_VALUE[simState.actualState.DEC05] + 1);
    }
    if (hasChecked("DEC05")) simState.knownState.DEC05.stale = true;
    simState.activeEventBoosts.DEC05 = 35;
  }

  if (evt.id === "EVT04") {
    message = "被災地域から食料・飲料水等の緊急輸送要請が入りました。支援船の受入れ可否について早急な判断が求められています。";
    simState.activeEventBoosts.DEC12 = 30;
    simState.activeEventBoosts.DEC13 = 25;
  }

  addMessage("left","event","⚠ EVENT",message);
  logDebug("EVENT", evt.id, "actualState", JSON.parse(JSON.stringify(simState.actualState)));
  refreshOptionsIfMidTurn();
}

function refreshOptionsIfMidTurn() {
  if (simState.currentTurn >= 2 && simState.currentTurn <= 13 && !simState.finished) {
    simState.currentOptions = generateDynamicOptions();
    renderOptions(simState.currentOptions, true);
  }
}

/* =========================
   Option Generation
========================= */
function baseOption(dec, type="CHECK", label=null) {
  return {
    id:`${type}-${dec}-${Math.random().toString(36).slice(2,7)}`,
    dec,
    type,
    label: label || DEC_META[dec].baseLabel,
    priority:0
  };
}

function generateTurn01Options() {
  return INITIAL_OPTIONS.map(x => ({...x}));
}

function generateFollowUpCandidates() {
  const out = [];
  if (!simState.lastResult) return out;
  const { dec, reportedLevel } = simState.lastResult;
  const list = FOLLOW_UPS[dec] || [];
  for (const fu of list) {
    if (reportedLevel !== "UNKNOWN" && levelAtLeast(reportedLevel, fu.minLevel)) {
      const opt = baseOption(fu.dec, "FOLLOW_UP", fu.label);
      opt.priority += 50;
      out.push(opt);
    }
  }
  return out;
}

function generateKnownRiskCandidates() {
  const out = [];
  for (const [dec, info] of Object.entries(simState.knownState)) {
    if (info.level === "UNKNOWN") continue;
    let riskBoost = 0;
    if (info.level === "L4") riskBoost = 40;
    else if (info.level === "L3") riskBoost = 35;
    else if (info.level === "L2") riskBoost = 25;
    if (!riskBoost) continue;

    for (const related of (RELATIONS[dec] || [])) {
      const opt = baseOption(related);
      opt.priority += riskBoost;
      out.push(opt);
    }
  }
  return out;
}

function generateUnconfirmedCandidates() {
  const out = [];
  for (const dec of Object.keys(DEC_META)) {
    if (!hasChecked(dec)) {
      const opt = baseOption(dec);
      opt.priority += 20 + (SCENARIO_IMPORTANCE[dec] || 0);
      out.push(opt);
    }
  }
  return out;
}

function generateEventCandidates() {
  const out = [];
  for (const [dec, boost] of Object.entries(simState.activeEventBoosts)) {
    const recheck = hasChecked(dec);
    const label = recheck ? `【再確認】${DEC_META[dec].baseLabel}` : DEC_META[dec].baseLabel;
    const opt = baseOption(dec, recheck ? "RECHECK" : "CHECK", label);
    opt.priority += 30 + boost;
    out.push(opt);
  }
  return out;
}

function generateRecheckCandidates() {
  const out = [];
  for (const [dec, info] of Object.entries(simState.knownState)) {
    if (info.level === "UNKNOWN") continue;
    if (info.stale || info.confidence === "C") {
      const opt = baseOption(dec, "RECHECK", `【再確認】${DEC_META[dec].baseLabel}`);
      opt.priority += 20 + (info.stale ? 10 : 0);      out.push(opt);
    }
  }
  return out;
}

function applyPhaseBoost(option) {
  const t = simState.currentTurn;
  if (t <= 5 && ["DEC03","DEC04","DEC05","DEC06","DEC08"].includes(option.dec)) option.priority += 10;
  if (t >= 6 && t <= 10 && ["DEC07","DEC08","DEC09","DEC10","DEC11"].includes(option.dec)) option.priority += 10;
  if (t >= 11 && t <= 13 && ["DEC10","DEC11","DEC12","DEC13"].includes(option.dec)) option.priority += 15;
  if (simState.remainingSeconds <= 120 && ["DEC10","DEC11","DEC12","DEC13"].includes(option.dec)) option.priority += 5;
  if (simState.remainingSeconds <= 60 && ["FOLLOW_UP"].includes(option.type)) option.priority -= 5;
}

function applyRepeatPenalty(option) {
  const last = nowTurnEntry(option.dec);
  if (!last) return;
  const gap = simState.currentTurn - last.turn;
  if (gap <= 1) option.priority -= 30;
  else if (gap <= 2) option.priority -= 20;

  const info = simState.knownState[option.dec];
  if (info && info.level === "L0" && info.confidence === "A" && !info.stale) {
    option.priority -= 25;
  }
}

function mergeCandidates(candidates) {
  const map = new Map();
  for (const c of candidates) {
    // Keep separate follow-up labels, but merge same dec/type/label duplicates.
    const key = `${c.dec}|${c.type}|${c.label}`;
    if (!map.has(key) || map.get(key).priority < c.priority) {
      map.set(key, c);
    }
  }
  return [...map.values()];
}

function enforceDiversity(candidates) {
  const sorted = [...candidates].sort((a,b) => b.priority - a.priority);
  const selected = [];
  const countByDec = {};

  for (const c of sorted) {
    if ((countByDec[c.dec] || 0) >= 2) continue;
    selected.push(c);
    countByDec[c.dec] = (countByDec[c.dec] || 0) + 1;
    if (selected.length === 4) break;
  }

  // Ensure at least two different DEC categories when possible.
  const unique = new Set(selected.map(x => x.dec));
  if (unique.size === 1) {
    const replacement = sorted.find(x => x.dec !== selected[0].dec);
    if (replacement) selected[selected.length - 1] = replacement;
  }

  // Fill if short.
  if (selected.length < 4) {
    for (const dec of Object.keys(DEC_META)) {
      if (selected.length >= 4) break;
      const exists = selected.some(x => x.dec === dec && x.type === "CHECK");
      if (!exists) selected.push(baseOption(dec));
    }
  }

  return selected.slice(0,4);
}

function generateDynamicOptions() {
  let candidates = [
    ...generateFollowUpCandidates(),
    ...generateKnownRiskCandidates(),
    ...generateUnconfirmedCandidates(),
    ...generateEventCandidates(),
    ...generateRecheckCandidates()
  ];

  candidates = mergeCandidates(candidates);

  for (const option of candidates) {
    applyPhaseBoost(option);
    applyRepeatPenalty(option);
    option.priority += (Math.random()*6 - 3);
  }

  candidates.sort((a,b)=>b.priority-a.priority);
  logDebug("TURN", simState.currentTurn, "candidates", candidates.map(x=>({label:x.label,dec:x.dec,p:x.priority.toFixed(1)})));
  return enforceDiversity(candidates);
}

function generateRecoveryOptions() {
  const candidates = [];

  const known = simState.knownState;
  if (known.DEC05.level !== "UNKNOWN" && levelAtLeast(known.DEC05.level,"L3")) {
    candidates.push({id:"REC-CHANNEL", type:"RECOVERY", dec:"DEC05", label:"航路啓開を優先する"});
  }
  if ((known.DEC03.level !== "UNKNOWN" && levelAtLeast(known.DEC03.level,"L3")) ||
      (known.DEC06.level !== "UNKNOWN" && levelAtLeast(known.DEC06.level,"L3"))) {
    candidates.push({id:"REC-BERTH", type:"RECOVERY", dec:"DEC03", label:"岸壁・背後の応急復旧を優先する"});
  }
  if (known.DEC03.level !== "UNKNOWN" && known.DEC03.level === "L4") {
    candidates.push({id:"REC-ALTBERTH", type:"RECOVERY", dec:"DEC03", label:"自港内の代替岸壁へ切り替える"});
  }

  const severeKnown = Object.values(known).filter(x => ["L3","L4"].includes(x.level)).length;
  if (severeKnown >= 2) {
    candidates.push({id:"REC-ALTPORT", type:"RECOVERY", dec:"DEC12", label:"代替港利用を進める"});
  }

  if (simState.eventHistory.some(x => x.id === "EVT04")) {
    candidates.push({id:"REC-RELIEF", type:"RECOVERY", dec:"DEC12", label:"緊急物資輸送を優先する"});
  }

  candidates.push({id:"REC-EXTERNAL", type:"RECOVERY", dec:"DEC10", label:"外部応援・復旧資源を要請する"});

  // Unique and cap 5.
  const uniq = [];
  const ids = new Set();
  for (const c of candidates) {
    if (!ids.has(c.id)) { ids.add(c.id); uniq.push(c); }
  }
  return uniq.slice(0,5);
}

function generateFinalPolicyOptions() {
  return FINAL_POLICIES.map(x => ({...x, type:"POLICY"}));
}

function renderOptions(options, refreshed=false) {
  simState.currentOptions = options;
  choiceList.innerHTML = "";

  for (const opt of options) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-button";
    btn.textContent = opt.label;
    btn.dataset.optionId = opt.id;
    btn.addEventListener("click", () => handleDecision(opt));
    choiceList.appendChild(btn);
  }

  if (refreshed) {
    promptText.textContent = "状況が更新されました。次の対応を選択してください";
  } else if (simState.currentTurn === 14) {
    promptText.textContent = "復旧・代替方針を選択してください";
  } else if (simState.currentTurn === 15) {
    promptText.textContent = "最終的な港湾運用方針を選択してください";
  } else {
    promptText.textContent = "次の対応を選択してください";  }

  syncControlHeight();
  scrollLatestMessageIntoView();
}

/* =========================
   Result Resolution
========================= */
function determineConfidence(type) {
  const r = Math.random();
  if (type === "FOLLOW_UP" || type === "RECHECK") {
    return r < 0.70 ? "A" : "B";
  }
  return r < 0.40 ? "A" : (r < 0.80 ? "B" : "C");
}

function possiblyUnderReport(actual, confidence) {
  if (confidence !== "C") return actual;
  const n = LEVEL_VALUE[actual];
  if (n <= 0) return actual;
  return Math.random() < 0.55 ? clampLevel(n-1) : actual;
}

function resolveInspection(option) {
  const actual = simState.actualState[option.dec];
  const confidence = determineConfidence(option.type);
  const reported = possiblyUnderReport(actual, confidence);
  let text = RESULT_MASTER[option.dec][reported];

  // Add a few contextual sub-results.
  if (option.dec === "DEC08" && levelAtLeast(reported,"L2")) {
    text += "\n非常用電源は使用可能ですが、継続運転条件の確認が必要です。";
  }
  if (option.dec === "DEC10" && ["L0","L1"].includes(reported) && levelAtLeast(simState.actualState.DEC05,"L3")) {
    text += "\n航路啓開に必要な作業船・資機材を確保できる見込みです。";
  }
  if (option.dec === "DEC12" && levelAtLeast(reported,"L2")) {
    text += "\n重要物資・主要貨物の優先順位付けが必要です。";
  }

  return {
    dec: option.dec,
    actualLevel: actual,
    reportedLevel: reported,
    confidence,
    text
  };
}

function updateKnownState(result) {
  const k = simState.knownState[result.dec];
  k.level = result.reportedLevel;
  k.confidence = result.confidence;
  k.confirmed = result.confidence === "A";
  k.lastCheckedTurn = simState.currentTurn;
  k.stale = false;
  simState.activeEventBoosts[result.dec] = 0;
}

function resolveRecovery(option) {
  let successClass = "NORMAL";
  const targetDec = option.dec;

  const knownTarget = simState.knownState[targetDec];
  const dec10Known = simState.knownState.DEC10;

  if (knownTarget && knownTarget.level !== "UNKNOWN" &&
      dec10Known && ["L0","L1","L2"].includes(dec10Known.level)) {
    successClass = "HIGH";
  } else if (!knownTarget || knownTarget.level === "UNKNOWN") {
    successClass = "LOW";
  }

  let roll = Math.random();
  let outcome = "SMALL";
  if (successClass === "HIGH") {
    outcome = roll < 0.60 ? "GOOD" : (roll < 0.90 ? "PARTIAL" : "SMALL");
  } else if (successClass === "NORMAL") {
    outcome = roll < 0.35 ? "GOOD" : (roll < 0.80 ? "PARTIAL" : "SMALL");
  } else {
    outcome = roll < 0.15 ? "GOOD" : (roll < 0.50 ? "PARTIAL" : "SMALL");
  }

  const affected = new Set();

  if (option.id === "REC-CHANNEL") affected.add("DEC05");
  if (option.id === "REC-BERTH") { affected.add("DEC03"); affected.add("DEC06"); }
  if (option.id === "REC-ALTBERTH") affected.add("DEC03");
  if (option.id === "REC-ALTPORT") affected.add("DEC12");
  if (option.id === "REC-RELIEF") { affected.add("DEC12"); affected.add("DEC13"); }
  if (option.id === "REC-EXTERNAL") affected.add("DEC10");

  for (const dec of affected) {
    const current = LEVEL_VALUE[simState.actualState[dec]];
    if (outcome === "GOOD") {
      simState.actualState[dec] = clampLevel(current >= 4 ? 2 : Math.max(1, current-2));
    } else if (outcome === "PARTIAL") {
      simState.actualState[dec] = clampLevel(Math.max(0, current-1));
    }
  }

  let text = "";
  if (outcome === "GOOD") text = "対応は十分な効果を上げ、対象機能を大きく改善しました。";
  if (outcome === "PARTIAL") text = "対応は部分的に効果を上げました。条件付きで利用可能な範囲が拡大しました。";
  if (outcome === "SMALL") text = "短時間では十分な効果を得られませんでした。追加対応が必要です。";

  simState.recoveryResult = {
    optionId: option.id,
    label: option.label,
    successClass,
    outcome,
    affected:[...affected]
  };

  return text;
}


function setChoiceButtonsDisabled(disabled) {
  const buttons = choiceList.querySelectorAll(".choice-button");
  buttons.forEach(btn => btn.disabled = disabled);
}

function clearChoices() {
  choiceList.innerHTML = "";
}

/* =========================
   Turn Flow
========================= */
function renderTurn() {
  updateHeader();
  if (simState.currentTurn === 1) {
    renderOptions(generateTurn01Options());
  } else if (simState.currentTurn >= 2 && simState.currentTurn <= 13) {
    renderOptions(generateDynamicOptions());
  } else if (simState.currentTurn === 14) {
    addMessage("left","system","システム","確認フェーズを終了します。現在までに得た情報を基に、復旧・代替方針を決定してください。");
    renderOptions(generateRecoveryOptions());
  } else if (simState.currentTurn === 15) {
    addMessage("left","system","システム","最終的な港湾運用方針を決定してください。");
    renderOptions(generateFinalPolicyOptions());
  }
}

function handleDecision(option) {
  if (simState.finished || !option) return;

  setChoiceButtonsDisabled(true);

  addMessage("right","player","あなた",option.label);

  if (simState.currentTurn <= 13) {
    const result = resolveInspection(option);
    updateKnownState(result);
    simState.lastResult = result;

    addMessage("left","result","調査結果",
      result.text + `

${LEVEL_MEANING[result.reportedLevel]}`,
      `被災レベル ${result.reportedLevel}「${LEVEL_LABEL[result.reportedLevel]}」 ／ 情報確度 ${result.confidence}`
    );

    simState.decisionHistory.push({
      turn:simState.currentTurn,
      dec:option.dec,
      optionId:option.id,
      label:option.label,
      knownBefore:null,
      result:{...result}
    });

  } else if (simState.currentTurn === 14) {
    const recoveryText = resolveRecovery(option);
    addMessage("left","result","復旧・代替結果",recoveryText);
    simState.decisionHistory.push({
      turn:14,
      dec:"DEC14",
      optionId:option.id,
      label:option.label,
      result:{...simState.recoveryResult}
    });

  } else if (simState.currentTurn === 15) {
    simState.finalPolicy = option.id;
    simState.decisionHistory.push({
      turn:15,
      dec:"DEC15",
      optionId:option.id,
      label:option.label
    });
    clearChoices();
    finishSimulation();
    return;
  }

  simState.currentTurn += 1;
  updateHeader();

  setTimeout(() => {
    if (!simState.finished) {
      renderTurn();
    }
  }, 250);
}

/* =========================
   Scoring
========================= */
function effectiveFunction(decList) {
  const vals = decList.map(dec => LEVEL_FUNCTION[simState.actualState[dec]] ?? 0);
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

function timePenalty() {
  const T = Math.max(0, simState.elapsedSeconds - TARGET_SECONDS);
  if (T <= 0) return 0;
  if (T <= 15) return 0.2*T;
  if (T <= 30) return 3 + 0.3*(T-15);
  if (T <= 60) return 7.5 + 0.5*(T-30);
  return 22.5 + 0.75*(Math.min(T,120)-60);
}

function riskPenalty() {
  let p = 0;
  const details = [];
  for (const [dec, actual] of Object.entries(simState.actualState)) {
    if (!["L2","L3","L4"].includes(actual)) continue;
    const known = simState.knownState[dec];
    const trulyUnknown = !known || known.level === "UNKNOWN";
    if (!trulyUnknown) continue;

    let d = actual === "L2" ? 2 : actual === "L3" ? 5 : 10;
    p += d;
    details.push(`${DEC_META[dec]?.name || dec}：${actual}「${LEVEL_LABEL[actual]}」 — ${LEVEL_MEANING[actual]}`);
  }
  return { penalty:Math.min(25,p), details };
}

function priorityScoreApprox() {
  // Prototype: reward checking high-severity actual states early,
  // but discount hindsight by also accepting any checked L2+ as useful.
  const inspected = simState.decisionHistory.filter(x => x.turn <= 13 && x.dec && DEC_META[x.dec]);
  if (!inspected.length) return 0;
  let pts = 0;
  for (const d of inspected) {
    const actual = simState.actualState[d.dec];
    if (actual === "L4") pts += 3;
    else if (actual === "L3") pts += 2.5;
    else if (actual === "L2") pts += 2;
    else if (actual === "L1") pts += 1.2;
    else pts += 0.8;
  }
  return Math.min(10, pts / (inspected.length*3) * 10);
}

function recoveryScore() {
  if (!simState.recoveryResult) return 0;
  if (simState.recoveryResult.outcome === "GOOD") return 10;
  if (simState.recoveryResult.outcome === "PARTIAL") return 7;
  return 3;
}

function finalPolicyScore() {
  const severe = ["DEC03","DEC05","DEC07","DEC11"].some(dec => simState.actualState[dec] === "L4");
  const moderate = ["DEC03","DEC05","DEC07","DEC11"].some(dec => simState.actualState[dec] === "L3");
  if (simState.finalPolicy === "POLICY-NORMAL") {
    if (severe) return 0;
    if (moderate) return 2;
    return 5;
  }
  if (simState.finalPolicy === "POLICY-CONDITIONAL") {
    if (severe) return 3;
    return 5;
  }
  if (simState.finalPolicy === "POLICY-RELIEF") {
    return simState.eventHistory.some(x=>x.id==="EVT04") ? 5 : 3;
  }
  if (simState.finalPolicy === "POLICY-ALTERNATIVE") {
    return severe ? 5 : 2;
  }
  return 0;
}

function informationScore() {
  let totalSeverity = 0;
  let foundSeverity = 0;
  for (const [dec, actual] of Object.entries(simState.actualState)) {
    const sev = actual==="L4" ? 3 : actual==="L3" ? 2 : actual==="L2" ? 1 : 0;
    totalSeverity += sev;
    if (sev > 0 && simState.knownState[dec]?.level !== "UNKNOWN") foundSeverity += sev;
  }
  const riskPart = totalSeverity ? (foundSeverity/totalSeverity)*10 : 10;
  let confidencePart = 5;
  const staleCount = Object.values(simState.knownState).filter(x => x.stale).length;
  const cCount = Object.values(simState.knownState).filter(x => x.confidence === "C").length;
  confidencePart -= Math.min(3, staleCount*1 + cCount*0.5);
  return { riskPart, confidencePart:Math.max(0,confidencePart) };
}

function calculateMetrics() {
  const sea = effectiveFunction(["DEC04","DEC05","DEC13"]);
  const berth = effectiveFunction(["DEC03","DEC06","DEC07"]);
  const hinterland = effectiveFunction(["DEC06","DEC11"]);
  const base = effectiveFunction(["DEC08","DEC09","DEC10"]);
  const logistics = effectiveFunction(["DEC12","DEC13"]);

  let portRecovery = 0.25*sea + 0.25*berth + 0.20*hinterland + 0.15*base + 0.15*logistics;
  let relief = 0.30*sea + 0.25*berth + 0.20*hinterland + 0.15*base + 0.10*logistics;
  let regional = 0.20*sea + 0.20*berth + 0.25*hinterland + 0.10*base + 0.15*logistics + 10;

  if (simState.actualState.DEC05 === "L4") portRecovery = Math.min(portRecovery,40);
  if (simState.actualState.DEC03 === "L4") portRecovery = Math.min(portRecovery,45);
  if (simState.actualState.DEC11 === "L4") regional = Math.min(regional,35);

  return {
    sea, berth, hinterland, base, logistics,
    portRecovery:Math.round(portRecovery),
    relief:Math.round(Math.min(100,relief)),
    regional:Math.round(Math.min(100,regional))
  };
}

function grade(score) {
  if (score >= 90) return ["S","極めて良好"];
  if (score >= 75) return ["A","主要機能を適切に確保"];
  if (score >= 60) return ["B","限定的な機能確保"];
  if (score >= 40) return ["C","重大なボトルネックが残存"];
  return ["D","港湾機能継続に重大な課題"];
}

function buildFeedback(metrics, riskInfo) {
  const positives = [];
  const improvements = [];

  const checkedL34 = simState.decisionHistory
    .filter(x => x.turn <= 13 && x.dec && ["L3","L4"].includes(x.result?.actualLevel))
    .slice(0,2);

  for (const x of checkedL34) {
    positives.push(`${DEC_META[x.dec].name}の重大リスクを確認し、判断材料を確保しました。`);
  }

  if (simState.recoveryResult?.outcome === "GOOD") {
    positives.push("TURN14の復旧・代替方針が十分な効果を上げました。");
  } else if (simState.recoveryResult?.outcome === "PARTIAL") {
    positives.push("TURN14で部分的な機能回復につながる対応を選択しました。");
  }

  if (riskInfo.details.length) {
    improvements.push(`未確認の重大リスクが残りました：${riskInfo.details.join("、")}`);
  }

  const overtime = Math.max(0, simState.elapsedSeconds - TARGET_SECONDS);
  if (overtime > 0) improvements.push(`目標時間を${overtime}秒超過しました。`);

  const stale = Object.entries(simState.knownState).filter(([,v]) => v.stale);
  if (stale.length) {
    improvements.push(`状態変化後に再確認していない項目があります：${stale.map(([d])=>DEC_META[d].name).join("、")}`);
  }

  if (!positives.length) positives.push("限られたTURNの中で必要情報を選択し、最終方針まで到達しました。");
  if (!improvements.length) improvements.push("重大な未確認リスクは限定的でした。今後は判断時間の短縮も確認してください。");

  return {
    positives:positives.slice(0,2),
    improvements:improvements.slice(0,2)
  };
}

function finishSimulation() {
  simState.finished = true;
  if (timerHandle) clearInterval(timerHandle);

  const metrics = calculateMetrics();

  const functionScore =
    15*(metrics.sea/100) +
    15*(metrics.berth/100) +
    10*(metrics.hinterland/100) +
    10*(metrics.base/100) +
    10*(metrics.logistics/100);

  const decisionScore = priorityScoreApprox() + recoveryScore() + finalPolicyScore();
  const info = informationScore();
  const informationScoreTotal = info.riskPart + info.confidencePart;

  const baseScore = functionScore + decisionScore + informationScoreTotal;
  const riskInfo = riskPenalty();
  const tPenalty = timePenalty();

  let final = baseScore - riskInfo.penalty - tPenalty;

  const criticalL4 = ["DEC03","DEC05","DEC07","DEC11"].some(dec => simState.actualState[dec] === "L4");
  const criticalL3 = ["DEC03","DEC05","DEC07","DEC11"].some(dec => simState.actualState[dec] === "L3");

  if (simState.finalPolicy === "POLICY-NORMAL" && criticalL4) final = Math.min(final,39);
  else if (simState.finalPolicy === "POLICY-NORMAL" && criticalL3) final = Math.min(final,59);

  if (simState.elapsedSeconds - TARGET_SECONDS > 120) final = Math.min(final,30);
  final = Math.max(0, Math.min(100, final));

  const [rank, rankText] = grade(final);
  const overtime = Math.max(0, simState.elapsedSeconds - TARGET_SECONDS);
  const feedback = buildFeedback(metrics, riskInfo);

  addMessage("left","score","SIMULATION COMPLETE",
    `完了時間　${formatClock(simState.elapsedSeconds)}\n超過時間　${overtime ? formatClock(-overtime).replace("－","") : "00:00"}`
  );

  const scoreHtml =
    `BCP対応得点　${baseScore.toFixed(1)}点\n` +
    `重大リスク減点　－${riskInfo.penalty.toFixed(1)}点\n` +
    `時間超過減点　－${tPenalty.toFixed(1)}点\n\n` +
    `最終得点　${final.toFixed(1)}点\n` +
    `判定　${rank}　${rankText}`;
  addMessage("left","score","最終評価",scoreHtml);

  addMessage("left","score","機能評価",
    `自港港湾機能回復率　${metrics.portRecovery}％\n` +
    `被災地支援機能　${metrics.relief}％\n` +
    `地域物流継続率　${metrics.regional}％`
  );

  addMessage("left","result","適切だった判断",feedback.positives.map((x,i)=>`${i+1}. ${x}`).join("\n"));
  addMessage("left","result","改善できる判断",feedback.improvements.map((x,i)=>`${i+1}. ${x}`).join("\n"));

  if (riskInfo.details.length) {
    addMessage("left","event danger","未確認リスク",riskInfo.details.join("\n"));
  }

  promptText.textContent = "シミュレーションは終了しました";
  choiceList.style.display = "none";
  restartButton.style.display = "block";
  syncControlHeight();
  scrollLatestMessageIntoView();
  progressBar.style.width = "100%";

  logDebug("FINAL actualState", simState.actualState);
  logDebug("FINAL knownState", simState.knownState);
  logDebug("FINAL decisions", simState.decisionHistory);
}

restartButton.addEventListener("click", resetSimulation);


if ("ResizeObserver" in window && controlWrap) {
  const controlObserver = new ResizeObserver(() => {
    syncControlHeight();
  });
  controlObserver.observe(controlWrap);
} else {
  window.addEventListener("resize", syncControlHeight);
}

window.addEventListener("orientationchange", () => {
  setTimeout(syncControlHeight, 100);
});

levelHelpButton.addEventListener("click", () => {
  const open = levelGuide.classList.toggle("open");
  levelHelpButton.setAttribute("aria-expanded", open ? "true" : "false");
  levelGuide.setAttribute("aria-hidden", open ? "false" : "true");
  levelHelpButton.textContent = open ? "L0～L4を閉じる" : "L0～L4とは？";
  setTimeout(() => {
    syncControlHeight();
    scrollLatestMessageIntoView();
  }, 0);
});

resetSimulation();
</script>
